  <link rel="stylesheet" href="css/styles.css" />

<body>
  <header class="topbar">
    <a class="brand" href="#/practice" aria-label="InkLab home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="11" y="3" width="10" height="16" rx="4" fill="currentColor" />
        <rect x="13" y="19" width="6" height="5" rx="1.5" fill="currentColor" opacity=".7" />

      </span>

    <nav class="tabs" aria-label="Sections">
      <a href="#/practice" data-route="practice">Practice</a>
      <a href="#/roadmap" data-route="roadmap">Roadmap</a>

      <a href="#/fix" data-route="fix">What went wrong?</a>
      <a href="#/questions" data-route="questions">Instructor Qs</a>
